<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro en modo oscuro.
      try {
        var t = localStorage.getItem('dividir:tema') || 'sistema';
        if (t === 'sistema') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Saca una foto a la boleta, la IA la divide y cada uno paga su parte con Mercado Pago." />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Dividir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
